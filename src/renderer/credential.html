<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>服务器登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="credential-page">
  <form id="credential-form" autocomplete="off">
    <h1>服务器登录</h1>
    <p id="credential-origin" class="muted small"></p>
    <label>用户名<input id="credential-username" type="text" autocomplete="off" maxlength="256" required autofocus></label>
    <label>密码<input id="credential-password" type="password" autocomplete="off" maxlength="4096"></label>
    <label class="credential-remember"><input id="credential-remember" type="checkbox">记住这个服务器的 HTTP 认证账号密码</label>
    <p id="credential-storage-note" class="muted small">勾选后由系统加密保存，仅在相同服务器、端口和认证 Realm 中复用；不会自动填写网页登录表单。提交失败后不循环重试。</p>
    <p id="credential-error" class="form-error" role="alert" hidden></p>
    <footer class="dialog-actions"><button id="cancel-credential" type="button">取消</button><button id="submit-credential" class="primary" type="submit">登录</button></footer>
  </form>
  <script type="module" src="../../dist/src/renderer/credential.js"></script>
</body>
</html>
